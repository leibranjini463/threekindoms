<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记录编辑</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="src/ui.css">
<style>
  /* Save editor for the browser build: reads and writes the game's own record slots, so it must be opened on the
     same origin as the game (/hd2d-mvp/save-editor.html). Opened from the title's 系统 → 记录编辑; 返回游戏 goes back. Editable fields and their
     ranges come from src/core/saveedit.js; the look is the game's own lacquer panels, busts and gear icons. */
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: #0c0907; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, #0000 0%, #0c0907d0 55%, #0c0907 85%), url(assets/ai/backdrops/autumn.webp) center top / cover no-repeat; opacity: .55; filter: saturate(.7); }
  .ed { max-width: 1440px; margin: 0 auto; padding: 22px 24px 96px; display: grid; gap: 16px; }

  /* Head */
  .ed-head { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .ed-head h1 { margin: 0; font: 46px/1 var(--brush); letter-spacing: 6px; color: #fff3d6; text-shadow: 0 0 2px #000, 0 4px 0 #4a1408, 0 0 30px #f6a03c55; }
  .ed-head p { margin: 0 0 4px; color: var(--dim); font-size: 14px; max-width: 64ch; text-wrap: pretty; }
  .ed-head .back { margin: 0 0 4px auto; }
  .panel.ed-box { position: relative; }

  /* Record slots */
  .slots-rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; padding: 10px; }
  .slotc { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 2px 8px; align-items: center; padding: 6px 8px; text-align: left;
    background: #0005; border: 1px solid #5a442888; border-radius: 3px; color: var(--ink); transition: .12s; min-width: 0; }
  .slotc:hover:not(:disabled) { border-color: var(--gold); background: #ffffff0a; }
  .slotc.on { border-color: #ffd890; background: linear-gradient(#4a3218, #24180f); box-shadow: 0 0 14px #ffb34a33, inset 0 0 0 1px #00000080; }
  .slotc:disabled { opacity: .38; cursor: default; }
  .slotc img { grid-row: span 2; width: 38px; height: 44px; object-fit: cover; object-position: 50% 15%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }
  .slotc .no { font: 600 13px var(--serif); color: var(--gold); letter-spacing: 1px; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .slotc .no i { font-style: normal; font-size: 11px; padding: 0 4px; border-radius: 2px; color: #1a1009; background: #e8c070; letter-spacing: 0; }
  .slotc .when { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .blank { display: block; width: 40px; height: 48px; border: 1px dashed #5a442866; border-radius: 2px; }
  .slotc .blank { grid-row: span 2; width: 38px; height: 44px; border: 1px dashed #5a442888; border-radius: 2px; }
  /* The quick record is a separate row; eight regular records keep enough room for their date and ruler. */
  .slotc.quick { grid-column: 1 / -1; grid-template-columns: 38px auto minmax(0, 1fr); }
  .slotc.quick img, .slotc.quick .blank { grid-row: auto; }

  /* Tabs */
  .ed-tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ed-tabs .btn { min-width: 76px; font-size: 18px; }
  .ed-tabs .btn.on { border-color: #ffd890; color: #fff4d8; background: linear-gradient(#5a3a1c, #2c1e12); }
  .ed-tabs .btn small { margin-left: 6px; font-size: 12px; color: var(--dim); }
  .ed-tabs .sp { flex: 1; }
  .ed-tabs .meta { color: var(--dim); font-size: 14px; }
  .ed-tabs .meta b { color: var(--ink); font-weight: 600; }

  /* Master–detail */
  .md { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .list { display: flex; flex-direction: column; height: min(72vh, 760px); min-height: 420px; }
  .list-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 12px 8px; border-bottom: 1px solid #8a6a3440; }
  .list-bar input, .list-bar select, .sel { font: 15px var(--serif); color: var(--ink); background: #0007; border: 1px solid #5a4428; border-radius: 3px; padding: 4px 7px; }
  .list-bar input { flex: 1 1 8em; min-width: 0; } .list-bar input:focus, .list-bar select:focus { outline: none; border-color: var(--gold); }
  .se-chips { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
  .se-chip { padding: 1px 9px; font-size: 14px; border: 1px solid #5a442888; border-radius: 2px; background: #0004; color: var(--dim); }
  .se-chip:hover { color: var(--ink); border-color: var(--gold2); }
  .se-chip.on { color: #2a1606; background: linear-gradient(#ffe6a0, #e0b860); border-color: #ffe6a0; }
  .se-chip small { margin-left: 4px; font-size: 11px; opacity: .8; }
  .rows { overflow-y: auto; flex: 1; padding: 6px 6px 10px; scrollbar-color: #5a4428 transparent; }
  .row { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 4px 6px;
    background: none; border: 1px solid transparent; border-radius: 3px; text-align: left; }
  .row:hover { background: #ffffff0c; }
  .row.on { background: #ffd8901a; border-color: #8a6a34; }
  .row img { width: 40px; height: 48px; object-fit: cover; object-position: 50% 12%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }
  .row.dead img { filter: grayscale(1) brightness(.6); } .row.yet img { filter: brightness(.75) saturate(.5); }
  .row .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm em { font-style: normal; font-size: 12px; color: var(--gold); }
  .row .sub { font-size: 13px; color: var(--dim); display: flex; gap: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .sub b { font-weight: 500; color: #d8ccb4; }
  .row .tr { font-size: 13px; color: var(--dim); text-align: right; white-space: nowrap; display: grid; justify-items: end; gap: 2px; }
  .row .edited { width: 7px; height: 7px; border-radius: 50%; background: #ffd890; box-shadow: 0 0 6px #ffd890; }
  .dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px #0008; }
  .fac { display: inline-flex; align-items: center; gap: 6px; }
  .se-none { padding: 30px 10px; text-align: center; color: var(--dim); }

  /* Detail */
  .detail { padding: 18px 20px 20px; display: grid; gap: 16px; min-height: 420px; }
  .se-who { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: end; padding-bottom: 14px; border-bottom: 1px solid #8a6a3440; }
  .se-who .fig { width: 132px; height: 160px; object-fit: cover; object-position: 50% 8%; border: 1px solid var(--gold2); border-radius: 3px; background: #000;
    box-shadow: inset 0 0 0 2px var(--lacquer), 0 6px 18px #000a; }
  .se-who .fig.px { image-rendering: pixelated; }
  .se-who h2 { margin: 0; font: 40px/1.1 var(--brush); letter-spacing: 4px; color: #fff3d6; text-shadow: 0 3px 0 #4a1408; }
  .se-who h2 small { font: 14px var(--serif); letter-spacing: 1px; color: var(--dim); margin-left: 10px; }
  .se-who .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .se-tag { font-size: 13px; padding: 1px 8px; border: 1px solid #5a4428; border-radius: 2px; color: #d8ccb4; background: #0005; display: inline-flex; align-items: center; gap: 6px; }
  .se-tag.gold { color: #ffe2a0; border-color: #8a6a34; }
  .se-who .se-acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .se-who .se-acts .btn { font-size: 15px; padding: 4px 12px; }

  .sec { display: grid; gap: 8px; }
  .sec h4 { margin: 0; font: 600 14px var(--serif); letter-spacing: 3px; color: var(--gold); display: flex; align-items: center; gap: 10px; }
  .sec h4::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #8a6a3466, transparent); }
  .stats-ed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 28px; }
  .stat { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 3px 0; }
  .stat > label { color: var(--dim); font-size: 15px; letter-spacing: 1px; }
  .stat.changed > label { color: #ffe2a0; }
  .se-meter { position: relative; height: 22px; }
  .se-meter input[type=range] { position: absolute; inset: 0; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: none; cursor: pointer; }
  .se-meter input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 1px; background: linear-gradient(90deg, #c88a3a, #ffd890) 0 / var(--p, 0%) 100% no-repeat, #000a; box-shadow: inset 0 0 0 1px #5a4428; }
  .se-meter input[type=range]::-moz-range-track { height: 8px; border-radius: 1px; background: #000a; box-shadow: inset 0 0 0 1px #5a4428; }
  .se-meter input[type=range]::-moz-range-progress { height: 8px; background: linear-gradient(90deg, #c88a3a, #ffd890); }
  .se-meter input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -5px; border-radius: 2px; background: linear-gradient(#fff0c8, #d8a050); border: 1px solid #3a2208; box-shadow: 0 1px 3px #000c; }
  .se-meter input[type=range]::-moz-range-thumb { width: 12px; height: 18px; border-radius: 2px; background: linear-gradient(#fff0c8, #d8a050); border: 1px solid #3a2208; }
  .se-meter input[type=range]:focus-visible { outline: 2px solid #ffd890; outline-offset: 2px; }
  .se-meter .was { position: absolute; top: 2px; width: 2px; height: 18px; margin-left: -1px; background: #fff8; pointer-events: none; border-radius: 1px; }
  .se-meter .was[hidden] { display: none; }
  .val { display: flex; align-items: center; gap: 6px; }
  .val input { width: 4.4em; font: 600 16px var(--serif); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); background: #0008; border: 1px solid #5a4428; border-radius: 3px; padding: 2px 6px; }
  .val input:focus { outline: none; border-color: var(--gold); }
  .stat.changed .val input { border-color: #ffd890; background: #3a2208c0; color: #fff4d8; }
  .se-delta { min-width: 3.6em; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--dim); }
  .se-delta.up { color: var(--good); } .se-delta.down { color: var(--bad); }
  .stat.locked { opacity: .45; pointer-events: none; }

  .se-gear { display: grid; gap: 6px; }
  .se-gear-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .se-gear-row .k { width: 3.4em; flex: none; color: var(--dim); font-size: 15px; }
  .eq { position: relative; width: 42px; height: 42px; padding: 3px; display: grid; place-items: center; border: 1px solid #5a442888; border-radius: 3px; background: #0006; transition: .1s; }
  .eq img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 1px 1px #000a); }
  .eq:hover { border-color: var(--gold); background: #ffffff10; }
  .eq.on { border-color: #ffd890; background: radial-gradient(#ffd89040, #3a2208c0); box-shadow: 0 0 10px #ffb34a55; }
  .eq.was::after { content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: #fff9; }
  .se-gear-now { font-size: 14px; color: var(--dim); margin-left: 3.4em; padding-left: 4px; min-height: 1.5em; }
  .se-gear-now b { color: #fff3d6; font-weight: 600; } .se-gear-now .changed { color: #ffe2a0; }

  /* City detail head */
  .se-who.city { grid-template-columns: minmax(0, 1fr) auto; }
  .gov { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .gov img { width: 30px; height: 36px; object-fit: cover; object-position: 50% 12%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }

  /* Alliance matrix */
  .al { padding: 18px 20px 20px; display: grid; gap: 14px; }
  .al p { margin: 0; color: var(--dim); font-size: 14px; }
  .al-wrap { overflow-x: auto; }
  .al table { border-collapse: separate; border-spacing: 4px; }
  .al th { font-weight: 600; font-size: 14px; color: var(--ink); padding: 2px; }
  .al thead th { vertical-align: bottom; }
  .al .lead { display: grid; justify-items: center; gap: 4px; min-width: 76px; }
  .al .lead img { width: 44px; height: 52px; object-fit: cover; object-position: 50% 12%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }
  .al tbody th .lead { grid-template-columns: 44px auto; justify-items: start; align-items: center; gap: 8px; min-width: 0; text-align: left; }
  .al td { width: 84px; height: 54px; text-align: center; border: 1px solid #5a442866; border-radius: 3px; background: #0005; }
  .al td.self { background: repeating-linear-gradient(45deg, #ffffff06 0 6px, #0000 6px 12px); border-color: #5a442833; }
  .al td:not(.on) output { color: #8a806c; }
  .al td.on { background: linear-gradient(#3e5a2a80, #1c2a1480); border-color: #8fd46a88; }
  .al td.changed { box-shadow: 0 0 0 1px #ffd890, 0 0 10px #ffb34a44; }
  .al td.hot { outline: 1px solid #ffd890aa; }
  .step { display: inline-flex; align-items: center; gap: 2px; }
  .step button { width: 22px; height: 24px; padding: 0; border: 1px solid #5a4428; border-radius: 2px; background: #0007; color: var(--dim); font-size: 15px; line-height: 1; }
  .step button:hover:not(:disabled) { color: #fff4d8; border-color: var(--gold); }
  .step button:disabled { opacity: .3; cursor: default; }
  .step output { min-width: 2.2em; font: 600 17px var(--serif); font-variant-numeric: tabular-nums; }
  .al td small { display: block; font-size: 11px; color: var(--dim); }

  /* 原版漏洞 */
  .bug { padding: 20px 22px 22px; display: grid; gap: 18px; }
  .bug-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
  .bug-hero .fig { width: 132px; height: 160px; object-fit: cover; object-position: 50% 8%; border: 1px solid var(--gold2); border-radius: 3px; background: #000; box-shadow: inset 0 0 0 2px var(--lacquer), 0 6px 18px #000a; }
  .bug-hero .fig.px { image-rendering: pixelated; }
  .bug-hero h2 { margin: 0 0 10px; font: 40px/1.1 var(--brush); letter-spacing: 4px; color: #fff3d6; text-shadow: 0 3px 0 #4a1408; }
  .bug-hero h2 small { font: 14px var(--serif); letter-spacing: 1px; color: var(--dim); margin-left: 12px; }
  .bug-hero p { margin: 12px 0 0; color: #d8ccb4; max-width: 62ch; text-wrap: pretty; }
  .se-switch { display: inline-flex; align-items: center; gap: 10px; padding: 4px 14px 4px 6px; border: 1px solid var(--gold2); border-radius: 18px; background: #0007; font-size: 15px; color: var(--dim); }
  .se-switch i { position: relative; width: 40px; height: 22px; border-radius: 11px; background: #2a1e14; box-shadow: inset 0 0 0 1px #5a4428; transition: background .15s; }
  .se-switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(#d8ccb4, #8a806c); transition: transform .15s, background .15s; }
  .se-switch.on { color: #ffe2a0; border-color: #ffd890; box-shadow: 0 0 12px #ffb34a44; }
  .se-switch.on i { background: linear-gradient(90deg, #8a2c1e, #c8402f); }
  .se-switch.on i::after { transform: translateX(18px); background: linear-gradient(#fff0c8, #e0b860); }
  .bug-steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
  .bug-steps li { counter-increment: step; position: relative; padding: 12px 14px 14px 44px; border: 1px solid #5a442888; border-radius: 3px; background: #0005; color: #d8ccb4; font-size: 14px; display: grid; gap: 6px; align-content: start; text-wrap: pretty; }
  .bug-steps li::before { content: counter(step); position: absolute; left: 12px; top: 11px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--serif); color: #2a1606; background: linear-gradient(#ffe6a0, #e0b860); }
  .bug-steps li b { font-size: 15px; color: var(--gold); letter-spacing: 2px; }
  .bug-steps li .btn { justify-self: start; font-size: 14px; padding: 3px 10px; margin-top: 4px; }
  .bug .hint { margin: 0; color: var(--dim); font-size: 14px; }
  .se-owners { display: flex; flex-wrap: wrap; gap: 8px; }
  .se-owner { display: grid; grid-template-columns: 34px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 5px 12px 5px 6px; border: 1px solid #5a442888; border-radius: 3px; background: #0005; text-align: left; }
  .se-owner img { grid-row: span 2; width: 34px; height: 40px; object-fit: cover; object-position: 50% 12%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }
  .se-owner small { font-size: 11px; color: var(--gold); }
  .se-owner:hover { border-color: var(--gold); }
  .se-owner.on { border-color: #ffd890; background: linear-gradient(#4a3218, #24180f); box-shadow: 0 0 12px #ffb34a33; }
  .copies { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .copy { display: grid; justify-items: center; gap: 3px; padding: 6px 4px; border: 1px solid #5a442888; border-radius: 3px; background: #0005; font-size: 13px; color: #d8ccb4; }
  .copy img { width: 40px; height: 48px; object-fit: cover; object-position: 50% 12%; border: 1px solid #5a4428; border-radius: 2px; background: #000; }
  .copy small { color: var(--dim); font-size: 12px; }
  .copy:hover { border-color: var(--gold); }
  @media (max-width: 900px) { .bug-steps { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .bug-hero { grid-template-columns: minmax(0, 1fr); } .bug-hero .fig { width: 96px; height: 116px; } }

  /* Action bar */
  .dock-ed { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9; display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 16px; width: max-content; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
  .dock-ed .count { font-size: 15px; color: var(--dim); margin-right: 6px; white-space: nowrap; }
  .dock-ed .count b { color: #ffe2a0; font-size: 18px; margin: 0 2px; }
  .dock-ed .sep { width: 1px; height: 24px; background: #8a6a3466; margin: 0 4px; }

  /* Number keypad (short screens): the value and its range beside a 3×4 pad, so it fits 320 px */
  .kp-wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: stretch; }
  .kp-side { display: grid; align-content: start; gap: 6px; min-width: 9em; }
  .kp-side .foot { margin-top: auto; padding-top: 12px; }
  .kp-val { font: 600 40px/1.1 var(--serif); color: #fff4d8; font-variant-numeric: tabular-nums; padding: 4px 10px; border: 1px solid var(--gold2); border-radius: 3px; background: #0008; text-align: right; }
  .kp-side small { color: var(--dim); font-size: 13px; }
  .kp { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; }
  .kp .btn { height: 44px; padding: 0; font-size: 20px; }
  .kp .btn:last-child { font-size: 15px; }

  /* Confirmation list */
  .diff { max-height: 46vh; overflow: auto; margin: 6px 0 0; padding: 0; list-style: none; border-top: 1px solid #8a6a3440; font-variant-numeric: tabular-nums; }
  .diff li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 4px 2px; border-bottom: 1px solid #ffffff0a; font-size: 15px; }
  .diff li span:last-child { color: var(--dim); } .diff li b { color: #ffe2a0; font-weight: 600; }
  .empty-state { padding: 60px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .empty-state h3 { margin: 0; font: 30px var(--brush); letter-spacing: 3px; color: #fff3d6; }
  .empty-state p { margin: 0; color: var(--dim); max-width: 40ch; }

  @media (max-width: 1100px) { .slots-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); } .stats-ed { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) {
    .ed { padding: 14px 16px 150px; }
    .dock-ed .sep { display: none; }
    .ed-head h1 { font-size: 36px; }
    .slots-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .md { grid-template-columns: minmax(0, 1fr); }
    .list { height: 46vh; min-height: 300px; }
    .se-who { grid-template-columns: auto minmax(0, 1fr); } .se-who .se-acts { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
    .se-who .fig { width: 92px; height: 112px; } .se-who h2 { font-size: 32px; }
  }
  /* Phone-only controls: the 记录 button beside the tabs, − and + beside each number, the back-to-list button and the
     rail's 返回游戏. The desktop layout has slots, a keyboard and room for both panes. */
  .slotpick, .se-step, .se-back, #back-rail, #sep-rail { display: none; }

  /* Short landscape screens (phones held sideways: devblog #356 D66, and the Android package) get the page as one
     screen, like a game menu, instead of a long page with a list scrolling inside it:
     - the actions are a rail on the right with a gutter of its own (a bottom bar sat over the sliders on a 320–390 px
       tall page), with 返回游戏 in it; the record slots fold into the 记录 button that leads the tabs;

const ask = (title, body, ok) => modal(title, (close) => [...[body].flat(), h('div', { class: 'foot' }, h('button', { class: 'btn', onclick: () => close(false) }, '取消'), h('button', { class: 'btn primary', onclick: () => close(true) }, ok))]);
function diffList(list) {
  const shown = list.slice(0, 60);
  return h('ul', { class: 'diff' }, shown.map((c) => h('li', {}, h('span', {}, c.text), h('span', {}, `${c.a} → `, h('b', {}, c.b)))),
    list.length > shown.length ? h('li', {}, h('span', {}, `……另有 ${list.length - shown.length} 项`), h('span')) : null);
}
$('write').onclick = async () => {
  const list = changes(); if (!list.length) return;
  const target = slot, editing = g, snapshot = target === 'quick' ? clone(g) : null, token = quickOpened, approved = snapshot && JSON.stringify(snapshot);
  if (!(await ask(`写回${slotName(slot)}`, [h('p', {}, `以下 ${list.length} 项改动将覆盖原记录。需要留底的话，先「导出」一份。`), diffList(list)], '写回'))) return;
  if (target === 'quick') {
    let written = null;
    const result = await G.saveQuickChecked(snapshot, token, {
      isCurrent: () => slot === target && g === editing && JSON.stringify(g) === approved,
      onSaved: (raw) => { written = raw; },
    });
    if (result === 'changed') { toast('<em>快捷存档已改变</em>，请重新打开后再编辑', 3500); return; }
    if (result === 'cancelled') { toast('<em>编辑内容已变化</em>，请重新写回', 3500); return; }
    if (result === 'busy') { toast('<em>快捷存档正在使用</em>，请稍后再试', 3500); return; }
    if (result === 'unavailable') { toast('<em>当前环境暂不能写回快捷存档</em>', 3500); return; }
    if (result !== 'saved') { toast('<em>写回失败</em>：浏览器存储不可用或已满', 3000); return; }
    // If edits arrive just after the write, use the written snapshot as the baseline and keep those edits.
    if (slot === target && g === editing) {
      if (!written || G.quickToken() !== written) { toast('<em>快捷存档已再次改变</em>，请重新打开', 3500); return; }
      const stored = G.loadSnapshot(JSON.parse(written), { quick: true });
      base = clone(stored); quickOpened = written; g.quickId = stored.quickId;
      renderSlots(); render();
    }
    toast(`<strong>已写回${slotName(target)}</strong>　回到游戏读取即可`, 3200);
    return;
  }
  if (!G.save(g, slot)) { toast('<em>写回失败</em>：浏览器存储不可用或已满', 3000); return; }
  open(slot); toast(`<strong>已写回${slotName(slot)}</strong>　回到游戏读取即可`, 3200);
};
$('revert').onclick = async () => {
  const n = changes().length; if (!n) return;
  if (await ask('放弃改动', h('p', {}, `放弃尚未写回的 ${n} 项改动，恢复为记录中的数值？`), '放弃')) { const keep = { ...pick }; open(slot); pick = keep; render(); }
};
// The Android package (apk/.../MainActivity.java) exposes NativeFiles: its WebView drops <a download> and blob: links
// without a word, and its file chooser offers only files typed as JSON (one sent through a chat app reads as
// octet-stream). save() opens the system's 保存到… sheet and open() its file picker; each answers once through
// window.__nativeFile({ ok, name, where, text, error }), and a cancelled sheet answers { ok: false }.
const nativeFiles = window.NativeFiles;
let fileWait = null;
window.__nativeFile = (r) => { const f = fileWait; fileWait = null; f?.(r || {}); };
const viaShell = (call) => new Promise((resolve) => { fileWait?.({}); fileWait = resolve; try { call(); } catch { window.__nativeFile({ error: 'unavailable' }); } });
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
$('export').onclick = async () => {
  if (!g) return;
  const name = `threekindoms-${slotName(slot)}-${g.year}年${g.month + 1}月.json`, text = JSON.stringify(g, null, 1);
  if (nativeFiles) {
    const r = await viaShell(() => nativeFiles.save(name, text));
    if (r.ok) toast(`<strong>已导出</strong>　${esc(r.name || name)}${r.where ? `<br>保存在「${esc(r.where)}」` : ''}`, 4200);
    else if (r.error) toast('<em>导出失败</em>：没能写入所选的位置', 3500);
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  h('a', { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`<strong>已导出</strong>　${esc(name)}`, 3200);
};
$('import').onclick = async () => {
  if (!nativeFiles) return $('file').click();
  const r = await viaShell(() => nativeFiles.open());
  if (r.ok && r.text != null) importRecord(r.name || '记录文件', r.text);
  else if (r.error === 'too-big') toast('<em>无法导入</em>：文件太大，不是记录文件', 3000);
  else if (r.error) toast('<em>无法导入</em>：读不出所选的文件', 3000);
};
$('file').onchange = async () => {
  const file = $('file').files[0]; $('file').value = ''; if (!file) return;
  importRecord(file.name, await file.text());
};
async function importRecord(fileName, text) {
  let rec; try { rec = JSON.parse(text); } catch { toast('<em>无法导入</em>：文件不是有效的 JSON', 3000); return; }
  const err = checkRecord(rec); if (err) { toast(`<em>无法导入</em>：${err}`, 3000); return; }
  const list = G.saves();
  const n = await modal('导入到哪个记录槽', (close) => [h('p', {}, `${fileName} · ${rec.year}年${rec.month + 1}月 · ${G.factionName(rec, rec.player)}。已有记录的槽会被覆盖。`),
    h('div', { class: 'slots-rail', style: { gridTemplateColumns: 'repeat(4, minmax(0,1fr))', padding: 0 } }, list.map((s, i) => h('button', { class: 'slotc', onclick: () => close(i + 1) },
      s ? avatar(s.factions[s.player].ruler) : h('span', { class: 'blank' }), h('span', { class: 'no' }, `记录${SLOT_NAMES[i]}`), h('span', { class: 'when' }, s ? `${s.year}年${s.month + 1}月` : '空')))),
    h('div', { class: 'foot' }, h('button', { class: 'btn', onclick: () => close(null) }, '取消'))], { wide: true });
  if (!n) return;
  if (n === slot && changes().length && !(await ask('覆盖当前记录', h('p', {}, '这个槽正在编辑，未写回的改动会丢失。'), '覆盖'))) return;
  if (!G.save(rec, n)) { toast('<em>导入失败</em>：浏览器存储不可用或已满', 3000); return; }
  open(n); toast(`<strong>已导入到记录${SLOT_NAMES[n - 1]}</strong>`, 2400);
}
// 返回游戏 asks in the page about unwritten changes: the desktop shell blocks a beforeunload without a dialog.
let leaving = false;
$('back').onclick = $('back-rail').onclick = async () => {
  const n = changes().length;
  if (n && !(await ask('返回游戏', h('p', {}, `尚未写回的 ${n} 项改动会丢失。`), '放弃并返回'))) return;
  leaving = true; location.replace(`index.html${location.search}`); // no history entry: a mouse's back button has nowhere to go
};
// Esc (and so the Android back key, which the package sends as Esc) steps back from a phone's detail pane to its list;
// with a dialog open the dialog takes it.
const onePane = matchMedia('(max-height: 520px) and (min-aspect-ratio: 4/3) and (max-width: 779.98px)');
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && paneDetail && onePane.matches && !document.querySelector('.shade') && (tab === 'officers' || tab === 'cities')) { e.preventDefault(); showList(); }
}, true);
addEventListener('beforeunload', (e) => { if (!leaving && changes().length) e.preventDefault(); });
// Focus moves between slots, the roster and the detail pane. Re-rendered rows are found by selection,
// so editing a general below the fold returns to that same general.
const selectedRow = () => document.querySelector('.rows .row.on') ?? document.querySelector('.rows .row');
const selectedSlot = () => [...document.querySelectorAll('#slots .slotc.on, #tabs .slotpick')].find(shown)
  ?? [ $('back'), $('back-rail') ].find(shown);
const modalTop = () => $('ui-top').lastElementChild;
const editorPad = createPad({
  onActivate() { if (!modalTop()) selectedSlot()?.focus(); },
  onFrame() {
    if (!editorPad.active) return;
    const dialog = modalTop(), a = document.activeElement;
    if (dialog && (!dialog.contains(a) || a.matches('.panel'))) firstIn(dialog)?.focus();
    else if (!dialog && a === document.body) selectedSlot()?.focus();
  },
  onButton(k, phase) {
    if (phase !== 'press') return;
    const dialog = modalTop(), a = document.activeElement;
    if (dialog) {
      if (k === 'b') sendKey('Escape');
      if (k === 'a') (dialog.contains(a) && a.matches('button') ? a : firstIn(dialog))?.click();
      return;
    }
    if (k === 'start') return $('write').click();
    if (k === 'b') {
      if (a.closest('.detail')) { showList(); selectedRow()?.focus(); }
      else if (a.closest('#body')) selectedSlot()?.focus();
      else $('back').click();
      return;
    }
    if (k !== 'a') return;
    if (a.matches('#slots [data-slot]')) {
      switchTo(a.dataset.slot === 'quick' ? 'quick' : Number(a.dataset.slot)).then(ok => {
        if (ok) selectedRow()?.focus();
      });
    } else if (a.matches('.rows .row')) {
      a.click();
      document.querySelector('.detail input[type=range]:not(:disabled)')?.focus();
    } else if (a.matches('button')) a.click();
  },
  onDir(dx, dy) {
    const dialog = modalTop(), a = document.activeElement;
    if (dialog) return walk(dialog, dx, dy);
    if (a.matches('.detail input[type=range]')) {
      if (dy) {
        const rows = [...document.querySelectorAll('.detail input[type=range]:not(:disabled)')];
        const next = rows[rows.indexOf(a) + dy];
        if (next) next.focus();
        else walk(document.body, 0, dy);
      } else if (dx) {
        dx > 0 ? a.stepUp() : a.stepDown();
        a.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
    if (a.matches('.rows .row') && dy) {
      const next = dy > 0 ? a.nextElementSibling : a.previousElementSibling;
      if (next) { next.focus(); return; }
    }
    if (a.matches('select') && dx) {
      a.selectedIndex = Math.max(0, Math.min(a.length - 1, a.selectedIndex + dx));
      a.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }
    const next = walk(document.body, dx, dy);
    if (next?.matches('.stat input[type=number]')) next.closest('.stat').querySelector('input[type=range]').focus();
  },
  onLook() {},
});
window.__editor = { get g() { return g; }, get slot() { return slot; }, changes };

const list = renderSlots(), latest = G.latest(list);
open(latest ? latest.slot ?? 'quick' : null);
</script>
